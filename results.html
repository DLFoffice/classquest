<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ห้องเรียนผจญภัย · สรุปผล</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/cq.css">
  <link rel="stylesheet" href="assets/css/fx.css">
  <link rel="stylesheet" href="assets/css/editor.css">
  <link rel="stylesheet" href="assets/css/modern.css">
  <script src="assets/js/config.js"></script>
  <script src="assets/js/engine.js"></script>
</head>
<body>
  <form class="mj rp-login" id="login" hidden>
    <div class="mj-hero"><div class="mj-m" id="lgMascot"></div><div><small>ห้องเรียนผจญภัย</small><h1>สรุปผล<br>การตอบคำถาม</h1></div></div>
    <div class="mj-body">
      <label class="mj-lbl" for="iKey">รหัสครู (HOST_KEY)</label>
      <div class="mj-in"><span>🔑</span><input id="iKey" type="password" autocomplete="current-password" required></div>
      <button class="mj-go"><span>เข้าดูผล</span><i>📊</i></button>
    </div>
  </form>
  <div class="rp" id="rp" hidden>
    <header class="rp-bar noprint">
      <div class="brand"><span class="logo">📊</span>สรุปผลการตอบคำถาม</div>
      <div class="rp-ctl">
        <label class="rp-sel"><span>ห้อง</span><select id="selRoom"></select></label>
        <button class="ed-ghost" id="bReload" title="ดึงข้อมูลล่าสุด">↻ รีเฟรช</button>
        <button class="ed-ghost" id="bCsv">⬇ CSV</button>
        <button class="rp-print" id="bPrint">🖨 พิมพ์ / PDF</button>
      </div>
    </header>
    <div id="out"></div>
  </div>
  <script type="module" src="assets/js/results.js"></script>
</body>
</html>
